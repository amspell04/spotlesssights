<div id="carousel">

    <button class="custom-icon" id="decreasebtn" mat-icon-button (click)="decreaseind()" [disabled]="index === 0">
        <mat-icon>arrow_back_ios</mat-icon> <!-- Use the name of the icon you want -->
      </button>
    <img id="currimage" [src]="photos[index]" alt="image">

<button class="custom-icon" id="increasebtn" mat-icon-button (click)="increaseind()" [disabled]="index === 4">
    <mat-icon>arrow_forward_ios</mat-icon> <!-- Use the name of the icon you want -->
  </button>
</div>


<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
